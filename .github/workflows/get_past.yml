name: get_past

on:
  schedule:
    - cron: "0 */1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    name: Deploy convert bundler
    runs-on: ubuntu-24.04

    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f
        with:
          php-version: "8.5"

      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Bundler Data (v3)
        run: php bundler.php v3 True

      - name: Rust stable version
        run: |
          cd rust_v3_covert_v1
          rustup update stable
          cargo build --release
          cargo run --release

      - name: Deploy JSON for bundler v3
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          FILES=$(
            {
              git ls-files -m -- 'docs/v3' | grep '\.json$'
              git diff --cached --name-only --diff-filter=AM -- 'docs/v3' | grep '\.json$'
              git ls-files --others --exclude-standard -- 'docs/v3' | grep '\.json$'
            } | {
              git ls-files -m -- 'docs/v1' | grep '\.json$'
              git diff --cached --name-only --diff-filter=AM -- 'docs/v1' | grep '\.json$'
              git ls-files --others --exclude-standard -- 'docs/v1' | grep '\.json$'
            } | sort -u
          )

          if [ -z "$FILES" ]; then
            echo "No JSON changes in docs/v3 to commit."
            exit 0
          fi

          git pull --rebase --autostash

          echo "$FILES" | xargs -d '\n' git add --

          git commit -m "chore: deploy JSON files to docs/v3 [skip ci]" || {
            echo "Nothing to commit."
            exit 0
          }

          git push origin HEAD || (git pull --rebase --autostash && git push origin HEAD)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
